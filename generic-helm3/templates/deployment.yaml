apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generic-helm3.fullname" . }}
  namespace: {{ include "generic-helm3.namespace" . }}
  labels:
    {{- include "generic-helm3.labels" . | nindent 4 }}
    {{- if .Values.datadog.enabled }}
    {{- include "generic-helm3.datadogLabels" . | nindent 4 }}
    {{- end }}
  {{- if and .Values.datadog.enabled .Values.datadog.logSource }}
  annotations:
    ad.datadoghq.com/{{ include "generic-helm3.containerName" . }}.logs: {{ list (dict "source" .Values.datadog.logSource) | toJson | quote }}
  {{- end }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "generic-helm3.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations (and .Values.datadog.enabled .Values.datadog.logSource) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.datadog.enabled .Values.datadog.logSource }}
        ad.datadoghq.com/{{ include "generic-helm3.containerName" . }}.logs: {{ list (dict "source" .Values.datadog.logSource) | toJson | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "generic-helm3.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.datadog.enabled }}
        admission.datadoghq.com/enabled: "true"
        {{- include "generic-helm3.datadogLabels" . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "generic-helm3.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "generic-helm3.containerName" . }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.datadog.enabled .Values.env }}
          env:
            {{- include "generic-helm3.datadogEnv" . | nindent 12 }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.service.containerPort }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- range $key, $value := .Values.extraContainers }}
        - name: {{ $key }}
          {{- toYaml $value | nindent 10 }}
      {{- end }}
      {{- with .Values.readinessGates }}
      readinessGates:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- range $key, $value := .Values.initContainers }}
        - name: {{ $key }}
          {{- toYaml $value | nindent 10 }}
      {{- end }}
      {{- end }}
      {{- if or .Values.volumes .Values.config }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "generic-helm3.fullname" . }}-config
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
      {{- $root := . }}
      {{- range $key, $value := .Values.topologySpreadConstraints }}
        - labelSelector:
            matchLabels:
              {{- include "generic-helm3.selectorLabels" $root | nindent 14 }}
          {{- toYaml $value | nindent 10 }}
      {{- end }}
      {{- end }}
