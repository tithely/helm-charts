  #       protocol: TCP
  # Config custom egress rules to the NetworkPolicy.
  # extraEgress: []
  # extraEgress:
  #   - to:
  #     - podSelector:
  #         matchLabels:
  #           component: apache
  #     ports:
  #     - port: 80
  #       protocol: TCP

topologySpreadConstraints: {}
