{{- if or (not .Values.tool) (eq .Values.tool "") (eq .Values.tool "flux") }}
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: {{ .Release.Name | quote }}
  namespace: flux-system
spec:
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: tithelybot@users.noreply.github.com
        name: tithelybot
      # Static message evaluated by Helm at render time (no Flux runtime template).
      # The previous `{{ `{{range .Changed.Images}}{{println .}}{{end}}` }}` used the old
      # image-automation template API and throws on the newer controller
      # ("can't evaluate field Images in type update.ResultV2"), so the automation
      # never commits and the env silently stops auto-deploying. A static message
      # cannot break across controller versions.
      messageTemplate: |-
        {{ .Release.Name }}: automated image update by Flux
    push:
      branch: main
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  update:
    {{- template "path" . }}
    strategy: Setters
{{- end }}
